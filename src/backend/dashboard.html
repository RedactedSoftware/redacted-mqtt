<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Telemetry Dashboard</title></head><body>
<h2>Live Telemetry</h2>
<table border="1"><thead><tr><th>Device</th><th>TS</th><th>Lat</th><th>Lon</th><th>Alt</th><th>Accel</th><th>Temp</th></tr></thead>
<tbody id="tb"></tbody></table>
<script>
const ws = new WebSocket("ws://localhost:8000/ws");
ws.onmessage = e => {
  const rows = JSON.parse(e.data);
  const tb = document.getElementById("tb");
  tb.innerHTML = "";
  rows.forEach(r=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${r.device_id}</td><td>${r.ts}</td><td>${(r.lat||'').toFixed ? r.lat.toFixed(6): r.lat}</td><td>${(r.lon||'').toFixed ? r.lon.toFixed(6): r.lon}</td><td>${r.alt_m}</td><td>${r.accel_x},${r.accel_y},${r.accel_z}</td><td>${r.temp_c}</td>`;
    tb.appendChild(tr);
  });
};
</script>
</body></html>
